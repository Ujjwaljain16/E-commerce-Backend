# Example only, not part of the kustomization. Create the real secret out of band, e.g.
#   kubectl -n ecommerce create secret generic ecommerce-secrets --from-env-file=secrets.env
# or manage it with Sealed Secrets / External Secrets. Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
type: Opaque
stringData:
  DATABASE_URL: postgres://postgres:change-me@postgres:5432/ecommerce?sslmode=disable
  POSTGRES_PASSWORD: change-me
  JWT_SECRET: replace-with-at-least-32-random-characters
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: replace-me-too
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  SMTP_FROM: shop@example.com
