global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: services
    static_configs:
      - targets: ["account-service:9090"]
        labels: { service: account-service }
      - targets: ["catalog-service:9091"]
        labels: { service: catalog-service }
      - targets: ["order-service:9092"]
        labels: { service: order-service }
      - targets: ["payment-service:9093"]
        labels: { service: payment-service }
      - targets: ["notification-service:9094"]
        labels: { service: notification-service }
      - targets: ["graphql-gateway:8000"]
        labels: { service: graphql-gateway }
