groups:
  - name: ecommerce
    rules:
      - alert: ServiceDown
        expr: up{job="services"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} is not being scraped"

      - alert: HighGrpcErrorRate
        expr: |
          sum by (service) (rate(grpc_requests_total{status=~"Internal|Unavailable|DeadlineExceeded|Unknown"}[5m]))
            / sum by (service) (rate(grpc_requests_total[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} server errors above 5%"

      - alert: HighGrpcLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (service, le) (rate(grpc_request_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} p95 latency above 500ms"

      - alert: KafkaMessagesDeadLettered
        expr: sum by (service, topic) (increase(kafka_messages_consumed_total{status="dead_lettered"}[15m])) > 0
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} dead-lettered messages from {{ $labels.topic }}"

      - alert: GatewayHighErrorRate
        expr: |
          sum(rate(http_requests_total{service="graphql-gateway", status=~"5.."}[5m]))
            / sum(rate(http_requests_total{service="graphql-gateway"}[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "GraphQL gateway 5xx above 5%"
