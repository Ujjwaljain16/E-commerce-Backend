services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./account/migrations/001_create_accounts_table.up.sql:/docker-entrypoint-initdb.d/1_account_001.sql
      - ./account/migrations/002_add_role_column.up.sql:/docker-entrypoint-initdb.d/1_account_002.sql
      - ./catalog/migrations/001_create_products_table.up.sql:/docker-entrypoint-initdb.d/2_catalog_001.sql
      - ./order/migrations/001_create_orders_table.up.sql:/docker-entrypoint-initdb.d/3_order_001.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  account-service:
    build:
      context: .
      dockerfile: account/Dockerfile
    container_name: account-service
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ecommerce?sslmode=disable
      JWT_SECRET: dev-secret-change-in-production
      PORT: 50051
      METRICS_PORT: 9090
    ports:
      - "50051:50051"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  catalog-service:
    build:
      context: .
      dockerfile: catalog/Dockerfile
    container_name: catalog-service
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ecommerce?sslmode=disable
      PORT: 50052
      METRICS_PORT: 9091
    ports:
      - "50052:50052"
      - "9091:9091"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: order/Dockerfile
    container_name: order-service
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ecommerce?sslmode=disable
      PORT: 50053
      METRICS_PORT: 9092
    ports:
      - "50053:50053"
      - "9092:9092"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
