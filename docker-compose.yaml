# Local stack: docker compose up -d --build
# Monitoring (Prometheus + Grafana): docker compose --profile monitoring up -d
#
# Secrets below are for local development only. Production values come from Kubernetes Secrets.

x-service-defaults: &service-defaults
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy

x-db-url: &db-url postgres://postgres:postgres@postgres:5432/ecommerce?sslmode=disable

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: ecommerce-redis
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    # Not published on 6379 to avoid clashing with a Redis already running on the host.
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: ecommerce-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: ecommerce-mailpit
    ports:
      - "8025:8025" # web UI to read the emails the notification service sends

  account-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: account/Dockerfile
    container_name: account-service
    environment:
      DATABASE_URL: *db-url
      JWT_SECRET: local-dev-jwt-secret-change-me-0123456789
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin-password-123
      PORT: 50051
      METRICS_PORT: 9090
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy

  catalog-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: catalog/Dockerfile
    container_name: catalog-service
    environment:
      DATABASE_URL: *db-url
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      PORT: 50052
      METRICS_PORT: 9091
    ports:
      - "50052:50052"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  order-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: order/Dockerfile
    container_name: order-service
    environment:
      DATABASE_URL: *db-url
      KAFKA_BROKERS: kafka:9092
      CATALOG_SERVICE_ADDR: catalog-service:50052
      PORT: 50053
      METRICS_PORT: 9092
    ports:
      - "50053:50053"

  payment-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: payment/Dockerfile
    container_name: payment-service
    environment:
      DATABASE_URL: *db-url
      KAFKA_BROKERS: kafka:9092
      PORT: 50054
      METRICS_PORT: 9093
    ports:
      - "50054:50054"

  notification-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: notification/Dockerfile
    container_name: notification-service
    environment:
      DATABASE_URL: *db-url
      KAFKA_BROKERS: kafka:9092
      ACCOUNT_SERVICE_ADDR: account-service:50051
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: shop@example.com
      PORT: 50055
      METRICS_PORT: 9094
    ports:
      - "50055:50055"

  graphql-gateway:
    build:
      context: .
      dockerfile: graphql/Dockerfile
    container_name: graphql-gateway
    restart: unless-stopped
    environment:
      PORT: 8000
      JWT_SECRET: local-dev-jwt-secret-change-me-0123456789
      ACCOUNT_SERVICE_ADDR: account-service:50051
      CATALOG_SERVICE_ADDR: catalog-service:50052
      ORDER_SERVICE_ADDR: order-service:50053
      PAYMENT_SERVICE_ADDR: payment-service:50054
      NOTIFICATION_SERVICE_ADDR: notification-service:50055
      PLAYGROUND_ENABLED: "true"
      RATE_LIMIT_RPS: 50
      RATE_LIMIT_BURST: 100
    ports:
      - "8000:8000"
    depends_on:
      - account-service
      - catalog-service
      - order-service
      - payment-service
      - notification-service

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ecommerce-prometheus
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
    ports:
      - "9190:9090"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: ecommerce-grafana
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  kafka_data:
